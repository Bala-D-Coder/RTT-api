services:
  postgres:
    image: postgres:16-alpine
    container_name: rtt-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: rtt
      POSTGRES_USER: rtt_user
      POSTGRES_PASSWORD: rtt_password
    volumes:
      - rtt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtt_user -d rtt"]
      interval: 5s
      timeout: 5s
      retries: 5

  whisper:
    build:
      context: ./services/whisper
      dockerfile: Dockerfile
    container_name: rtt-whisper
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      WHISPER_MODEL: small
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: 8
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rtt-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rtt
      SPRING_DATASOURCE_USERNAME: rtt_user
      SPRING_DATASOURCE_PASSWORD: rtt_password
      WHISPER_URL: http://whisper:8001
      ENGINE: mock
    depends_on:
      postgres:
        condition: service_healthy
      whisper:
        condition: service_healthy

volumes:
  rtt_pgdata:
